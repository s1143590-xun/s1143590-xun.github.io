<!DOCTYPE html>
<head>
    <style>
       h1.one {
            background-color: lightblue;
            border: 8px double tomato;
        }

        h1.two {
            background-color: yellow;
            border: 2px solid dodgerblue;
            border-radius: 8px;
        }

        h1.three {
            background-color: mediumseagreen;
            border-width: 8px;
            border-style: dotted;
            border-color: gray;
        }
    </style>
</head>
<body>

    <h1 class="one">Hello World</h1>
    <h1 class="two">Hello World</h1>
    <h1 class="three">Hello World</h1>

</body>
</html>
